<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Matematika Kelas 5</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
        }

        .container {
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #333;
        }

        .question {
            margin: 20px 0;
        }

        .question p {
            font-size: 18px;
        }

        .options {
            margin-top: 10px;
        }

        .options label {
            display: block;
            margin-bottom: 10px;
        }

        button {
            display: block;
            width: 100%;
            padding: 10px;
            font-size: 16px;
            background: #FF1616;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #FF1616;
        }

        .result {
            margin-top: 20px;
            text-align: center;
            font-size: 20px;
        }

        .correct {
            color: #28a745;
        }

        .wrong {
            color: #dc3545;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Quiz Matematika Kelas 5</h1>
        <form id="quizForm">
            <div class="question">
                <p>1. Ubah pecahan 7/10 ke desimal </p>
                <div class="options">
                    <label><input type="radio" name="q1" value="1,7"> 1,7</label>
                    <label><input type="radio" name="q1" value="0,7"> 0,7</label>
                    <label><input type="radio" name="q1" value="0,4"> 0,4</label>
                </div>
            </div>

            <div class="question">
                <p>2. Jika sekarang pukul 08.15 dan kegiatan sekolah berlangsung selama 5 jam 30 menit, pukul berapa kegiatan sekolah selesai?</p>
                <div class="options">
                    <label><input type="radio" name="q2" value="13.50"> 13.50</label>
                    <label><input type="radio" name="q2" value="14.45"> 14.45</label>
                    <label><input type="radio" name="q2" value="13.45"> 13.45</label>
                </div>
            </div>

            <div class="question">
                <p>3. Sebuah kolam berbentuk balok memiliki panjang 8 m, lebar 4 m, tinggi 2 m, berapakah volumenya?</p>
                <div class="options">
                    <label><input type="radio" name="q3" value="52"> 52 m³</label>
                    <label><input type="radio" name="q3" value="64"> 64 m³</label>
                    <label><input type="radio" name="q3" value="34"> 34 m³</label>
                </div>
            </div>

            <button type="button" onclick="submitQuiz()">Kirim Jawaban</button>
        </form>

        <div id="result" class="result"></div>
    </div>

    <script>
        function submitQuiz() {
            const correctAnswers = {
                q1: "0,7",
                q2: "13.45",
                q3: "64"
            };

            let score = 0;
            const form = document.getElementById('quizForm');
            const formData = new FormData(form);

            for (const [question, answer] of Object.entries(correctAnswers)) {
                if (formData.get(question) === answer) {
                    score++;
                }
            }

            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = `Kamu menjawab <span class="correct">${score}</span> dari <span class="wrong">3</span> pertanyaan dengan benar.`;
        }
    </script>
</body>
</html>
